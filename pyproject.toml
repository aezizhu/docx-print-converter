[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-print-converter"
version = "0.1.0"
description = "Local, structure-aware DOCX-to-PDF conversion with open-source renderers"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
docx-print-convert = "docx_print_converter.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
